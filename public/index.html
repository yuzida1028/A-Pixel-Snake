<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pixel Snake</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="game-column" aria-label="贪吃蛇游戏区">
        <header class="top-bar">
          <div>
            <h1>Pixel Snake</h1>
            <p id="statusText" class="status-text">准备开始</p>
          </div>
          <div class="score-board" aria-label="游戏数据">
            <div>
              <span>分数</span>
              <strong id="scoreValue">0</strong>
            </div>
            <div>
              <span>长度</span>
              <strong id="lengthValue">3</strong>
            </div>
            <div>
              <span>最高分</span>
              <strong id="bestScoreValue">0</strong>
            </div>
          </div>
        </header>

        <div class="canvas-frame">
          <canvas id="gameCanvas" width="480" height="480" aria-label="像素风贪吃蛇画布"></canvas>
          <div id="messageOverlay" class="message-overlay visible">
            <strong id="messageTitle">准备好了</strong>
            <span id="messageDetail">按开始游戏，或用 WASD 控制方向。</span>
          </div>
        </div>

        <div class="control-row" aria-label="游戏控制">
          <button id="startButton" type="button">开始游戏</button>
          <button id="pauseButton" type="button">暂停</button>
          <button id="restartButton" type="button">重新开始</button>
        </div>
      </section>

      <aside class="side-panel" aria-label="设置面板">
        <section class="panel-block">
          <h2>操作</h2>
          <p>W / A / S / D 控制方向，空格暂停或继续。窗口失焦会自动暂停。</p>
        </section>

        <section class="panel-block">
          <h2>豆子生成</h2>
          <label class="range-row" for="foodIntervalInput">
            <span>间隔</span>
            <strong><span id="foodIntervalValue">2.0</span>s</strong>
          </label>
          <input id="foodIntervalInput" type="range" min="0.5" max="5" step="0.1" value="2" />
          <p>移动速度保持独立，地图上最多同时存在 10 个豆子。</p>
        </section>

        <section class="panel-block">
          <h2>颜色</h2>
          <div class="color-grid">
            <label>
              <span>页面背景</span>
              <input id="pageBackgroundColor" type="color" />
            </label>
            <label>
              <span>游戏背景</span>
              <input id="boardBackgroundColor" type="color" />
            </label>
            <label>
              <span>蛇头</span>
              <input id="snakeHeadColor" type="color" />
            </label>
            <label>
              <span>蛇身</span>
              <input id="snakeBodyColor" type="color" />
            </label>
            <label>
              <span>豆子</span>
              <input id="foodColor" type="color" />
            </label>
            <label>
              <span>边界</span>
              <input id="borderColor" type="color" />
            </label>
          </div>
          <button id="resetSettingsButton" class="secondary-button" type="button">恢复默认设置</button>
        </section>
      </aside>
    </main>

    <script src="./game.js"></script>
  </body>
</html>
